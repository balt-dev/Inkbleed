[manifest]
version = "1.0.0"
dump_lua = true
priority = 20000

[[patches]]
[patches.pattern]
target = "game.lua"

pattern = '''v_antimatter=       {order = 24,    discovered = false, unlocked = false, available = true, cost = 10, name = "Antimatter", pos = {x=7,y=1}, set = "Voucher", config = {extra = 15}, requires = {'v_blank'},unlock_condition = {type = 'blank_redeems', extra = 10}},'''
position = "at"
payload = '''
v_antimatter=       {order = 24,    discovered = false, unlocked = false, available = true, cost = 10, name = "Antimatter", pos = {x=7,y=1}, set = "Voucher", config = {extra = 1}, requires = {'v_blank'},unlock_condition = {type = 'blank_redeems', extra = 10}},
'''
match_indent = true
times = 1
overwrite = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"

pattern = "local loc_vars = {}"
position = "after"
payload = '''
if _c.config then
    if _c.config.extra_disp then loc_vars = {_c.config.extra_disp}
    elseif _c.config.extra then loc_vars = {_c.config.extra}
    end
end
'''
match_indent = false
times = 1

[[patches]]
[patches.pattern]
target = "card.lua"

pattern = '''if center_table.name == 'Antimatter' then
        G.E_MANAGER:add_event(Event({func = function()
            if G.jokers then
                G.jokers.config.card_limit = G.jokers.config.card_limit + 1
            end
            return true end }))
    end'''
position = "at"
payload = '''if center_table.name == 'Antimatter' then
        G.E_MANAGER:add_event(Event({func = function()
            if G.jokers then
                G.jokers.config.card_limit = G.jokers.config.card_limit + center_table.extra
            end
            return true end }))
    end'''
match_indent = false
times = 1
overwrite = true

[[patches]]
[patches.pattern]
target = "card.lua"

pattern = '''if center_table.name == 'Crystal Ball' then
    G.E_MANAGER:add_event(Event({func = function()
        G.consumeables.config.card_limit = G.consumeables.config.card_limit + 1
        return true end }))
end'''
position = "at"
payload = '''
if center_table.name == 'Crystal Ball' then
    G.E_MANAGER:add_event(Event({func = function()
        G.consumeables.config.card_limit = G.consumeables.config.card_limit + center_table.extra
        return true end }))
end'''
times = 1
match_indent = false

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "G.hand:change_size(1)"
position = "at"
payload = "G.hand:change_size(center_table.extra)"
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "change_shop_size(1)"
position = "at"
payload = "change_shop_size(center_table.extra)"
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''elseif _c.name == "Clearance Sale" or _c.name == "Liquidation" then loc_vars = {cfg.extra}'''
position = "after"
payload = '''
elseif _c.name == "Crystal Ball" or _c.name == "Omen Globe" then loc_vars = {cfg.extra}
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''if _c.name == "Overstock" or _c.name == 'Overstock Plus' then'''
position = "at"
payload = '''
